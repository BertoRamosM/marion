<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netlify Forms Handler</title>
  </head>
  <body>
    <!-- Form for Netlify -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" method="POST" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <p hidden>
        <label>
          Don't fill this out if you're human: <input name="bot-field" />
        </label>
      </p>
      <input type="text" name="name" required />
      <input type="email" name="email" required />
      <input type="text" name="frenchLevel" />
      <input type="tel" name="phone" />
      <input type="text" name="objet" />
      <input type="text" name="message" required />
      <!-- Which page the form was sent from, e.g. "/fr/cours-de-francais-rennes".
           Filled in automatically, never shown to or editable by the visitor.
           It has to be declared here or Netlify drops it: this file is the
           form definition Netlify reads at deploy time, and it records only
           the fields it finds in it. Not required, so an older cached page
           that submits without it still goes through. -->
      <input type="text" name="source" />
      <button type="submit">Send Message</button>
    </form>
  </body>
</html>
